const b2u = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function unlock() {
  const btn = document.getElementById('go'), err = document.getElementById('err');
  const pw = document.getElementById('pw').value;
  if (!pw) return;
  btn.disabled = true; err.textContent = '確認中…';
  try {
    const enc = new TextEncoder();
    const km = await crypto.subtle.importKey('raw', enc.encode(pw), 'PBKDF2', false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey(
      { name:'PBKDF2', salt:b2u(SALT), iterations:310000, hash:'SHA-256' },
      km, { name:'AES-GCM', length:256 }, false, ['decrypt']);
    const plain = await crypto.subtle.decrypt({ name:'AES-GCM', iv:b2u(IV) }, key, b2u(DATA));
    const html = new TextDecoder().decode(plain);
    window.__hijiPw = pw;   // 画面の中で巡回結果（同じパスワードで暗号化）を読むため。保存はしない
    document.open(); document.write(html); document.close();
  } catch (e) {
    err.textContent = 'パスワードが違います';
    btn.disabled = false;
  }
}
document.getElementById('go').addEventListener('click', unlock);
document.getElementById('pw').addEventListener('keydown', e => { if (e.key === 'Enter') unlock(); });
