const b2u = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function unlock() {
  const btn = document.getElementById('go'), err = document.getElementById('err');
  const pw = document.getElementById('pw').value;
  if (!pw) return;
  btn.disabled = true; err.textContent = '確認中…';
  try {
    const enc = new TextEncoder();
    const km = await crypto.subtle.importKey('raw', enc.encode(pw), 'PBKDF2', false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey(
      { name:'PBKDF2', salt:b2u(SALT), iterations:310000, hash:'SHA-256' },

    document.open(); document.write(html); document.close();
  } catch (e) {
    err.textContent = 'パスワードが違います';
    btn.disabled = false;
  }
}
